<section class="auth-page">
  <div class="auth-box">

    <h2 class="auth-titulo">Faça seu Login</h2>

    <form class="auth-form" (ngSubmit)="entrar()">

      <label class="campo">
        <span class="campo-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M13 11h5M13 15h5" />
          </svg>
        </span>
        <input type="text"
               name="cpf"
               [(ngModel)]="cpf"
               (input)="mascararCpf($event)"
               placeholder="CPF"
               maxlength="14"
               autocomplete="username" />
      </label>

      <label class="campo">
        <span class="campo-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </span>
        <input type="password"
               name="senha"
               [(ngModel)]="senha"
               placeholder="Senha"
               autocomplete="current-password" />
      </label>

      <p class="auth-erro" *ngIf="erro">{{ erro }}</p>

      <button type="submit" class="btn-auth" [disabled]="enviando">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" />
        </svg>
        {{ enviando ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

    <div class="auth-rodape">
      <p>Não possui conta?</p>
      <a routerLink="/cadastro" class="btn-auth-secundario">Criar Conta</a>
    </div>

  </div>
</section>
