<section class="admin-page">
  <a routerLink="/admin" class="voltar">← Voltar para adicionar produtos</a>

  <div class="catalogo-card">

    <div class="catalogo-head">
      <span class="logo-mark">
        <img src="assets/logo.png" alt="Seiva Mística" />
      </span>
      <h2>Editar Produtos</h2>
      <div class="divider"></div>
      <p class="admin-sub">Altere ou remova produtos já cadastrados</p>
    </div>

    <p class="status" *ngIf="carregando">Carregando...</p>
    <p class="status erro" *ngIf="erro">{{ erro }}</p>

    <div class="produtos" *ngIf="!carregando && produtos.length > 0">
      <article class="produto" *ngFor="let p of produtos">
        <div class="produto-img">
          <img [src]="p.imagem" [alt]="p.nome" />
        </div>
        <h4>{{ p.nome }}</h4>
        <div class="produto-footer">
          <span class="preco">R$ {{ p.preco.toFixed(2) }}</span>
          <span class="tag">{{ p.categoria }}</span>
        </div>
        <div class="produto-admin-acoes">
          <button type="button" class="btn-editar" (click)="editar(p)">Editar</button>
          <button type="button" class="btn-excluir" (click)="excluir(p)">Excluir</button>
        </div>
      </article>
    </div>

    <div class="carrinho-vazio" *ngIf="!carregando && produtos.length === 0">
      Nenhum produto cadastrado.
    </div>

  </div>
</section>
